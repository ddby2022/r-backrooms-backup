name: Manual Wikidot Backup

on:
  workflow_dispatch:
  
permissions:
  contents: write 
  
jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install wikit CLI
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 https://raw.githubusercontent.com/kakushi-w/wikit/main/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run full backup
        run: |
          wikit backup all --config ./config.json

      - name: Compress backup files
        run: |
          zip -r backup.zip ./backup

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ github.run_number }}
          name: 社区数据备份 - 第 ${{ github.run_number }} 次
          body: 手动触发的全量备份（包含页面、论坛和附件）。
          files: backup.zip
